name: Feature request
description: Suggest a problem Formative should solve.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please describe the user problem first. The product plan explains current boundaries and planned work.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain when this gets in the way and who is affected.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would help?
      description: Describe what you would expect Formative to do, without prescribing every implementation detail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: Mention workarounds or other tools you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots are welcome. Remove private project information first.
